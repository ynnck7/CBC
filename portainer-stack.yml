# Portainer-Stack für Kronland (ohne Build-Schritt)
# Portainer → Stacks → Add stack → Web editor → einfügen → Deploy the stack
# Das Image baut GitHub Actions bei jedem Push auf main automatisch.
# Update: Stack öffnen → "Update the stack" mit "Re-pull image and redeploy".

services:
  kronland:
    image: ghcr.io/ynnck7/cbc:latest
    container_name: kronland
    restart: unless-stopped
    ports:
      - "8080:8080"          # links: Port auf dem Host, ggf. anpassen
    environment:
      ALLOW_REGISTRATION: "true"   # nach dem Anlegen eurer Konten auf "false"
      SECURE_COOKIE: "false"       # auf "true", sobald nur noch per HTTPS erreichbar
      SESSION_DAYS: "30"
      TZ: "Europe/Berlin"
    volumes:
      - kronland-data:/data

volumes:
  kronland-data:
